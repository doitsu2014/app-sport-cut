[workspace]
resolver = "2"
# One directory per Clean Architecture layer, outermost last. The directory a
# crate lives in is the layer it belongs to; `tools/check-layering.sh` enforces
# that the dependencies agree. See docs/architecture/layering.md.
members = ["entities/*", "use-cases/*", "gateways/*", "adapters/*", "drivers/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false
authors = ["Sportcut"]
description = "Offline badminton match analysis engine"

[workspace.dependencies]
# --- entities ---------------------------------------------------------------
sportcut-common = { path = "entities/common" }
sportcut-court = { path = "entities/court" }
sportcut-rally = { path = "entities/rally" }
sportcut-score = { path = "entities/score" }
sportcut-highlight = { path = "entities/highlight" }

# --- use cases --------------------------------------------------------------
sportcut-media = { path = "use-cases/media" }
sportcut-vision = { path = "use-cases/vision" }
sportcut-export = { path = "use-cases/export" }
sportcut-jobs = { path = "use-cases/jobs" }
sportcut-eval = { path = "use-cases/eval" }

# --- gateways and contracts -------------------------------------------------
sportcut-storage = { path = "gateways/storage" }
sportcut-protocol = { path = "gateways/protocol" }

# --- adapters ---------------------------------------------------------------
sportcut-api = { path = "adapters/api" }

clap = { version = "4.5", features = ["derive"] }
image = { version = "=0.24.9", default-features = false, features = ["jpeg"] }
tflite-c-rs = { version = "=0.0.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.13"
nix = { version = "0.31", features = ["socket", "user", "fs", "process", "signal"] }
rand = "0.8"

[workspace.lints.rust]
# `deny` rather than `forbid`, because the generated bridge glue in
# sportcut-api contains the FFI `unsafe` blocks and needs a narrow, explicit
# `#[allow(unsafe_code)]` on that one module. Every crate written by hand still
# forbids unsafe at its own crate root.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Frame sampling and proxy generation are dominated by the media toolchain, but
# the manifest and checkpoint code paths are exercised often enough to warrant
# optimized dependencies in local test runs.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

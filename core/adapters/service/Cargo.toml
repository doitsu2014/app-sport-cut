[package]
name = "sportcut-service"
description = "Background service process for the Sportcut engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sportcut_service"
path = "src/lib.rs"

[[bin]]
name = "sportcut-service"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# Enable the local macOS TFLite person detector through the api facade. The
# service owns the runtime and model paths, so this is the only switch needed.
macos-tflite-eval = ["sportcut-api/macos-tflite-eval"]

[dependencies]
anyhow = "1.0"
nix = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sportcut-api = { workspace = true }
sportcut-common = { workspace = true }
sportcut-media = { workspace = true }
sportcut-protocol = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

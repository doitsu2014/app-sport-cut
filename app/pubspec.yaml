name: sportcut
description: Offline badminton match analyzer — import, review, and export highlights on device.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  # Must match the version pinned in core/crates/api/Cargo.toml and the
  # generator version used by tools/generate-bridge.sh.
  flutter_riverpod: ^3.4.3
  flutter_rust_bridge: 2.13.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  sqflite: ^2.4.4
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Sportcut">
  <title>Sportcut</title>
  <!--
    Sportcut app mark.

    Dark stage tile, chalk court in perspective, and one court-green play
    signal on the net. Source for the macOS AppIcon set; regenerate with
    tools/generate-app-icons.sh.
  -->
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="#121814" stroke="#2B342E" stroke-width="3" filter="url(#shadow)"/>
  <g fill="none" stroke="#F2F5F0" stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 806 H846 L690 230 H334 Z" stroke-width="34"/>
    <path d="M256 543 H768" stroke-width="34"/>
    <path d="M512 806 V543" stroke-width="26"/>
  </g>
  <path d="M456 452 L612 543 L456 634 Z" fill="#46D08D"/>
</svg>

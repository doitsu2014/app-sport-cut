<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Sportcut">
  <title>Sportcut</title>
  <!--
    Small-size Sportcut mark: the centre line is dropped and the court is
    enlarged so the trapezoid and play signal survive at 16-64 px.
  -->
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="#121814" stroke="#2B342E" stroke-width="3"/>
  <g transform="translate(512 512) scale(1.12) translate(-512 -512)">
    <g fill="none" stroke="#F2F5F0" stroke-linecap="round" stroke-linejoin="round">
      <path d="M178 806 H846 L690 230 H334 Z" stroke-width="38"/>
      <path d="M256 543 H768" stroke-width="38"/>
    </g>
    <path d="M452 446 L616 543 L452 640 Z" fill="#46D08D"/>
  </g>
</svg>

ow-declared)"/><rect x="707.5" y="310.5" width="103.1" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="759.0" y="321.5" text-anchor="middle">decodes into models</text><path d="M 775.0 175.0 Q 775.0 195.0 775.0 215.0" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#arrow-declared)"/><rect x="842.1" y="185.5" width="73.7" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="879.0" y="196.5" text-anchor="middle">sends methods</text><path d="M 546.2 150.5 Q 768.1 227.8 990.0 305.2" fill="none" stroke="#a8630a" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrow-interim)"/><rect x="824.4" y="324.5" width="83.5" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="866.2" y="335.5" text-anchor="middle">reads/writes v5</text></g><g class="nodes"><g class="node component"><rect x="60.0" y="80.0" width="250.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="185.0" y="106.0" text-anchor="middle">analysis</text><text class="tech" x="185.0" y="119.0" text-anchor="middle">[Component: feature]</text><text class="body" x="185.0" y="143.0" text-anchor="middle">Artifact badges and rebuild state.</text></g><g class="node component"><rect x="60.0" y="180.0" width="250.0" height="83.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="185.0" y="206.0" text-anchor="middle">calibration</text><text class="tech" x="185.0" y="219.0" text-anchor="middle">[Component: feature]</text><text class="body" x="185.0" y="243.0" text-anchor="middle">Mark the court; render the engine&#x27;s</text><text class="body" x="185.0" y="255.5" text-anchor="middle">outline and net.</text></g><g class="node component"><rect x="60.0" y="280.0" width="250.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="185.0" y="306.0" text-anchor="middle">editing</text><text class="tech" x="185.0" y="319.0" text-anchor="middle">[Component: feature]</text><text class="body" x="185.0" y="343.0" text-anchor="middle">Score timeline and edit-list data.</text></g><g class="node component"><rect x="60.0" y="380.0" width="250.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="185.0" y="406.0" text-anchor="middle">export</text><text class="tech" x="185.0" y="419.0" text-anchor="middle">[Component: feature]</text><text class="body" x="185.0" y="443.0" text-anchor="middle">Export settings and start.</text></g><g class="node component"><rect x="60.0" y="480.0" width="250.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="185.0" y="506.0" text-anchor="middle">highlights</text><text class="tech" x="185.0" y="519.0" text-anchor="middle">[Component: feature]</text><text class="body" x="185.0" y="543.0" text-anchor="middle">Ranking and reel assembly.</text></g><g class="node component"><rect x="320.0" y="80.0" width="250.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="445.0" y="106.0" text-anchor="middle">library</text><text class="tech" x="445.0" y="119.0" text-anchor="middle">[Component: feature]</text><text class="body" x="445.0" y="143.0" text-anchor="middle">Match library, repository, import.</text></g><g class="node component"><rect x="320.0" y="180.0" width="250.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="445.0" y="206.0" text-anchor="middle">rally</text><text class="tech" x="445.0" y="219.0" text-anchor="middle">[Component: feature]</text><text class="body" x="445.0" y="243.0" text-anchor="middle">Rally review and boundaries.</text></g><g class="node component"><rect x="320.0" y="280.0" width="250.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="445.0" y="306.0" text-anchor="middle">score</text><text class="tech" x="445.0" y="319.0" text-anchor="middle">[Component: feature]</text><text class="body" x="445.0" y="343.0" text-anchor="middle">Score entry and serving sides.</text></g><g class="node component"><rect x="320.0" y="380.0" width="250.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="445.0" y="406.0" text-anchor="middle">tracking</text><text class="tech" x="445.0" y="419.0" text-anchor="middle">[Component: feature]</text><text class="body" x="445.0" y="443.0" text-anchor="middle">Player tracking overlay and panel.</text></g><g class="node component"><rect x="320.0" y="480.0" width="250.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="445.0" y="506.0" text-anchor="middle">workspace</text><text class="tech" x="445.0" y="519.0" text-anchor="middle">[Component: feature]</text><text class="body" x="445.0" y="543.0" text-anchor="middle">Studio shell, stage strip, playback.</text></g><g class="node component"><rect x="650.0" y="80.0" width="250.0" height="95.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="775.0" y="106.0" text-anchor="middle">SportcutEngine</text><text class="tech" x="775.0" y="119.0" text-anchor="middle">[Component:</text><text class="tech" x="775.0" y="131.0" text-anchor="middle">app/lib/src/bridge/sportcut_engine.dart]</text><text class="body" x="775.0" y="155.0" text-anchor="middle">Typed engine API. The only place the app</text><text class="body" x="775.0" y="167.5" text-anchor="middle">knows the service exists.</text></g><g class="node component"><rect x="650.0" y="215.0" width="250.0" height="95.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="775.0" y="241.0" text-anchor="middle">ServiceConnection</text><text class="tech" x="775.0" y="254.0" text-anchor="middle">[Component:</text><text class="tech" x="775.0" y="266.0" text-anchor="middle">app/lib/src/bridge/protocol_client.dart]</text><text class="body" x="775.0" y="290.0" text-anchor="middle">Unix socket, framing, request</text><text class="body" x="775.0" y="302.5" text-anchor="middle">correlation, handshake.</text></g><g class="node component"><rect x="650.0" y="345.0" width="250.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="775.0" y="371.0" text-anchor="middle">Models</text><text class="tech" x="775.0" y="384.0" text-anchor="middle">[Component: app/lib/src/bridge/models.dart]</text><text class="body" x="775.0" y="408.0" text-anchor="middle">Typed DTOs mirrored from the protocol.</text></g><g class="node component"><rect x="650.0" y="520.0" width="250.0" height="83.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="775.0" y="546.0" text-anchor="middle">Design system</text><text class="tech" x="775.0" y="559.0" text-anchor="middle">[Component: app/lib/src/app/design]</text><text class="body" x="775.0" y="583.0" text-anchor="middle">Tokens, metrics, typography, and shared</text><text class="body" x="775.0" y="595.5" text-anchor="middle">components.</text></g><g class="node component"><rect x="990.0" y="80.0" width="220.0" height="95.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="1100.0" y="106.0" text-anchor="middle">App shell</text><text class="tech" x="1100.0" y="119.0" text-anchor="middle">[Component: app/lib/src/app ·</text><text class="tech" x="1100.0" y="131.0" text-anchor="middle">di/router]</text><text class="body" x="1100.0" y="155.0" text-anchor="middle">Startup, dependency injection,</text><text class="body" x="1100.0" y="167.5" text-anchor="middle">routing.</text></g><g class="node component"><rect x="990.0" y="290.0" width="220.0" height="107.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="1100.0" y="316.0" text-anchor="middle">Client catalog</text><text class="tech" x="1100.0" y="329.0" text-anchor="middle">[Component:</text><text class="tech" x="1100.0" y="341.0" text-anchor="middle">features/library/data/match_catalog.dar</text><text class="tech" x="1100.0" y="353.0" text-anchor="middle">t]</text><text class="body" x="1100.0" y="377.0" text-anchor="middle">Interim v5 catalog. Service-owned</text><text class="body" x="1100.0" y="389.5" text-anchor="middle">from ADR-0001 Phase 4.</text></g><g class="node note"><rect x="960.0" y="440.0" width="280.0" height="83.5" rx="7" fill="#ffffff" stroke="#b9b4a9" stroke-width="1.2" stroke-dasharray="5 4"/><text class="name" x="1100.0" y="464.0" text-anchor="middle">No network</text><text class="note-body" x="1100.0" y="480.0" text-anchor="middle">There is no cloud service, telemetry</text><text class="note-body" x="1100.0" y="492.5" text-anchor="middle">endpoint, or online API on any path.</text><text class="note-body" x="1100.0" y="505.0" text-anchor="middle">Recordings and analysis stay on this Mac.</text></g></g><line x1="24" y1="708" x2="1216" y2="708" stroke="#e5e2da"/><line x1="24" y1="723" x2="50" y2="723" stroke="#3d444d" stroke-width="1.3"/><text class="legend" x="56" y="726">Declared relationship</text><line x1="189.1" y1="723" x2="215.1" y2="723" stroke="#a8630a" stroke-width="1.3" stroke-dasharray="6 4"/><text class="legend" x="221.1" y="726">Interim until ADR-0001 Phase 4</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="746" viewBox="0 0 1140 746" role="img" aria-labelledby="title desc">
<title id="title">Sportcut — Containers</title>
<desc id="desc">The separately running pieces, the data they own, and the tools they invoke.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .heading { font-size: 14px; font-weight: 600; fill: #1f2328; }
  .group-label { font-size: 9.5px; font-weight: 600; letter-spacing: 0.09em; fill: #6b7280; }
  .name { font-size: 12.5px; font-weight: 600; fill: #1f2328; }
  .tech { font-size: 9px; fill: #6b7280; }
  .body { font-size: 10px; fill: #3d444d; }
  .note-body { font-size: 10px; fill: #6b7280; font-style: italic; }
  .edge-label { font-size: 9.5px; fill: #3d444d; }
  .legend { font-size: 9.5px; fill: #6b7280; }
</style>
<defs>
  <marker id="arrow-declared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d444d"/></marker>
  <marker id="arrow-derived" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b939c"/></marker>
  <marker id="arrow-interim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8630a"/></marker>
</defs>
<rect x="0" y="0" width="1140" height="746" fill="#ffffff"/>
<text class="heading" x="24" y="26">L2 · Containers</text><g class="edges"><path d="M 552.4 143.0 Q 736.2 205.3 920.0 267.6" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#arrow-declared)"/><rect x="699.1" y="211.0" width="63.9" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="731.1" y="222.0" text-anchor="middle">plays video</text><path d="M 430.0 143.0 Q 430.0 271.5 430.0 400.0" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#arrow-declared)"/><rect x="360.0" y="256.5" width="108.0" height="30.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="414.0" y="267.5" text-anchor="middle">JSON-RPC over a Unix</text><text class="edge-label" x="414.0" y="278.5" text-anchor="middle">socket</text><path d="M 240.0 105.6 Q 270.0 104.9 300.0 104.3" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#arrow-declared)"/><rect x="255.5" y="111.4" width="29.6" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="270.3" y="122.4" text-anchor="middle">uses</text><path d="M 560.0 444.1 Q 590.0 444.6 620.0 445.2" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#arrow-declared)"/><rect x="508.3" y="486.5" width="93.3" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="555.0" y="497.5" text-anchor="middle">resolves binaries</text><path d="M 360.2 483.0 Q 295.5 521.5 230.8 560.0" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#arrow-declared)"/><rect x="235.8" y="498.2" width="103.1" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="287.3" y="509.2" text-anchor="middle">copies into custody</text><path d="M 430.0 483.0 Q 430.0 521.5 430.0 560.0" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#arrow-declared)"/><rect x="360.0" y="512.0" width="108.0" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="414.0" y="523.0" text-anchor="middle">owns catalog + files</text><path d="M 516.7 483.0 Q 576.2 511.5 635.8 540.0" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#arrow-declared)"/><rect x="532.5" y="516.4" width="73.7" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="569.3" y="527.4" text-anchor="middle">runs tracking</text><path d="M 560.0 95.6 Q 590.0 94.3 620.0 92.9" fill="none" stroke="#a8630a" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrow-interim)"/><rect x="531.7" y="152.7" width="122.7" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="593.1" y="163.7" text-anchor="middle">reads/writes v5 catalog</text></g><g class="nodes"><g class="node person"><rect x="40.0" y="60.0" width="200.0" height="95.5" rx="7" fill="#dbe7f0" stroke="#7f9fbf" stroke-width="1.2"/><text class="name" x="140.0" y="86.0" text-anchor="middle">Editor</text><text class="tech" x="140.0" y="99.0" text-anchor="middle">[Person: Human]</text><text class="body" x="140.0" y="123.0" text-anchor="middle">Imports a recording, marks the</text><text class="body" x="140.0" y="135.5" text-anchor="middle">court, confirms rallies and the</text><text class="body" x="140.0" y="148.0" text-anchor="middle">score, exports a highlight.</text></g><g class="node external"><rect x="40.0" y="560.0" width="200.0" height="108.0" rx="7" fill="#f4f2ee" stroke="#b9b4a9" stroke-width="1.2"/><text class="name" x="140.0" y="586.0" text-anchor="middle">Recording files</text><text class="tech" x="140.0" y="599.0" text-anchor="middle">[External system: User-owned files]</text><text class="body" x="140.0" y="623.0" text-anchor="middle">The recording the user picked.</text><text class="body" x="140.0" y="635.5" text-anchor="middle">Sportcut copies it into custody</text><text class="body" x="140.0" y="648.0" text-anchor="middle">and never modifies the</text><text class="body" x="140.0" y="660.5" text-anchor="middle">original.</text></g><g class="node container"><rect x="300.0" y="60.0" width="260.0" height="83.0" rx="7" fill="#e3ece6" stroke="#6f9a82" stroke-width="1.2"/><text class="name" x="430.0" y="86.0" text-anchor="middle">Flutter client</text><text class="tech" x="430.0" y="99.0" text-anchor="middle">[Container: Dart 3 · Riverpod · app/]</text><text class="body" x="430.0" y="123.0" text-anchor="middle">Library, studio, playback, and the</text><text class="body" x="430.0" y="135.5" text-anchor="middle">protocol client. Links no Rust.</text></g><g class="node container"><rect x="300.0" y="400.0" width="260.0" height="83.0" rx="7" fill="#e3ece6" stroke="#6f9a82" stroke-width="1.2"/><text class="name" x="430.0" y="426.0" text-anchor="middle">SportcutService</text><text class="tech" x="430.0" y="439.0" text-anchor="middle">[Container: Rust · core/adapters/service]</text><text class="body" x="430.0" y="463.0" text-anchor="middle">Background process. Owns media processing,</text><text class="body" x="430.0" y="475.5" text-anchor="middle">analysis, jobs, the catalog, and export.</text></g><g class="node dataStore"><rect x="300.0" y="560.0" width="260.0" height="83.0" rx="7" fill="#f4f2ee" stroke="#b9b4a9" stroke-width="1.2"/><text class="name" x="430.0" y="586.0" text-anchor="middle">State root</text><text class="tech" x="430.0" y="599.0" text-anchor="middle">[Data store: SQLite + files]</text><text class="body" x="430.0" y="623.0" text-anchor="middle">Catalog (schema v6 target), recordings,</text><text class="body" x="430.0" y="635.5" text-anchor="middle">artifacts, run/ and logs/.</text></g><g class="node dataStore"><rect x="620.0" y="40.0" width="230.0" height="95.5" rx="7" fill="#f4f2ee" stroke="#b9b4a9" stroke-width="1.2"/><text class="name" x="735.0" y="66.0" text-anchor="middle">Client v5 catalog</text><text class="tech" x="735.0" y="79.0" text-anchor="middle">[Data store: SQLite · interim]</text><text class="body" x="735.0" y="103.0" text-anchor="middle">The app&#x27;s own catalog and recording</text><text class="body" x="735.0" y="115.5" text-anchor="middle">copy until ADR-0001 Phase 4 retires</text><text class="body" x="735.0" y="128.0" text-anchor="middle">them.</text></g><g class="node external"><rect x="620.0" y="400.0" width="230.0" height="95.0" rx="7" fill="#f4f2ee" stroke="#b9b4a9" stroke-width="1.2"/><text class="name" x="735.0" y="426.0" text-anchor="middle">ffmpeg / ffprobe</text><text class="tech" x="735.0" y="439.0" text-anchor="middle">[External system: Media toolchain ·</text><text class="tech" x="735.0" y="451.0" text-anchor="middle">required]</text><text class="body" x="735.0" y="475.0" text-anchor="middle">Probe, proxy, audio, frames, and</text><text class="body" x="735.0" y="487.5" text-anchor="middle">export. Required at runtime.</text></g><g class="node external"><rect x="620.0" y="540.0" width="230.0" height="95.0" rx="7" fill="#f4f2ee" stroke="#b9b4a9" stroke-width="1.2"/><text class="name" x="735.0" y="566.0" text-anchor="middle">TFLite runtime + model</text><text class="tech" x="735.0" y="579.0" text-anchor="middle">[External system: EfficientDet-Lite0 ·</text><text class="tech" x="735.0" y="591.0" text-anchor="middle">optional]</text><text class="body" x="735.0" y="615.0" text-anchor="middle">Player tracking only. Absent when</text><text class="body" x="735.0" y="627.5" text-anchor="middle">the build omits macos-tflite-eval.</text></g><g class="node external"><rect x="920.0" y="260.0" width="200.0" height="83.0" rx="7" fill="#f4f2ee" stroke="#b9b4a9" stroke-width="1.2"/><text class="name" x="1020.0" y="286.0" text-anchor="middle">AVFoundation</text><text class="tech" x="1020.0" y="299.0" text-anchor="middle">[External system: macOS framework]</text><text class="body" x="1020.0" y="323.0" text-anchor="middle">Plays the recording and its</text><text class="body" x="1020.0" y="335.5" text-anchor="middle">proxy in the client.</text></g><g class="node note"><rect x="920.0" y="380.0" width="200.0" height="96.0" rx="7" fill="#ffffff" stroke="#b9b4a9" stroke-width="1.2" stroke-dasharray="5 4"/><text class="name" x="1020.0" y="404.0" text-anchor="middle">No network</text><text class="note-body" x="1020.0" y="420.0" text-anchor="middle">There is no cloud service,</text><text class="note-body" x="1020.0" y="432.5" text-anchor="middle">telemetry endpoint, or online</text><text class="note-body" x="1020.0" y="445.0" text-anchor="middle">API on any path. Recordings and</text><text class="note-body" x="1020.0" y="457.5" text-anchor="middle">analysis stay on this Mac.</text></g></g><line x1="24" y1="708" x2="1116" y2="708" stroke="#e5e2da"/><line x1="24" y1="723" x2="50" y2="723" stroke="#3d444d" stroke-width="1.3"/><text class="legend" x="56" y="726">Declared relationship</text><line x1="189.1" y1="723" x2="215.1" y2="723" stroke="#a8630a" stroke-width="1.3" stroke-dasharray="6 4"/><text class="legend" x="221.1" y="726">Interim until ADR-0001 Phase 4</text></svg>
erived)"/><path d="M 530.0 296.2 Q 680.0 231.4 830.0 166.6" fill="none" stroke="#8b939c" stroke-width="1.3" marker-end="url(#arrow-derived)"/><path d="M 530.0 369.1 Q 780.0 426.8 1030.0 484.5" fill="none" stroke="#8b939c" stroke-width="1.3" marker-end="url(#arrow-derived)"/><path d="M 1098.7 163.0 Q 1020.0 316.5 941.3 470.0" fill="none" stroke="#8b939c" stroke-width="1.3" marker-end="url(#arrow-derived)"/></g><g class="nodes"><g class="node component"><rect x="60.0" y="80.0" width="220.0" height="107.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="170.0" y="106.0" text-anchor="middle">Service host</text><text class="tech" x="170.0" y="119.0" text-anchor="middle">[Component: sportcut-service ·</text><text class="tech" x="170.0" y="131.0" text-anchor="middle">core/adapters/service]</text><text class="body" x="170.0" y="155.0" text-anchor="middle">Process host: Unix socket, peer</text><text class="body" x="170.0" y="167.5" text-anchor="middle">UID, single-instance lock, job</text><text class="body" x="170.0" y="180.0" text-anchor="middle">loop, cancellation.</text></g><g class="node component"><rect x="310.0" y="80.0" width="220.0" height="95.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="420.0" y="106.0" text-anchor="middle">Engine facade</text><text class="tech" x="420.0" y="119.0" text-anchor="middle">[Component: sportcut-api ·</text><text class="tech" x="420.0" y="131.0" text-anchor="middle">core/adapters/api]</text><text class="body" x="420.0" y="155.0" text-anchor="middle">The library the host calls.</text><text class="body" x="420.0" y="167.5" text-anchor="middle">Orchestrates the use cases.</text></g><g class="node component"><rect x="60.0" y="290.0" width="220.0" height="95.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="170.0" y="316.0" text-anchor="middle">Wire contract</text><text class="tech" x="170.0" y="329.0" text-anchor="middle">[Component: sportcut-protocol ·</text><text class="tech" x="170.0" y="341.0" text-anchor="middle">core/gateways/protocol]</text><text class="body" x="170.0" y="365.0" text-anchor="middle">Method names, DTOs, error codes,</text><text class="body" x="170.0" y="377.5" text-anchor="middle">framing, version negotiation.</text></g><g class="node component"><rect x="310.0" y="290.0" width="220.0" height="107.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="420.0" y="316.0" text-anchor="middle">Storage adapter</text><text class="tech" x="420.0" y="329.0" text-anchor="middle">[Component: sportcut-storage ·</text><text class="tech" x="420.0" y="341.0" text-anchor="middle">core/gateways/storage]</text><text class="body" x="420.0" y="365.0" text-anchor="middle">Catalog, artifacts, recording</text><text class="body" x="420.0" y="377.5" text-anchor="middle">store. Implements ports declared</text><text class="body" x="420.0" y="390.0" text-anchor="middle">by the use cases.</text></g><g class="node component"><rect x="630.0" y="80.0" width="180.0" height="95.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="720.0" y="106.0" text-anchor="middle">Jobs</text><text class="tech" x="720.0" y="119.0" text-anchor="middle">[Component: sportcut-jobs]</text><text class="body" x="720.0" y="143.0" text-anchor="middle">Job model, one heavy job at</text><text class="body" x="720.0" y="155.5" text-anchor="middle">a time, checkpoints,</text><text class="body" x="720.0" y="168.0" text-anchor="middle">resume.</text></g><g class="node component"><rect x="830.0" y="80.0" width="180.0" height="95.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="920.0" y="106.0" text-anchor="middle">Media</text><text class="tech" x="920.0" y="119.0" text-anchor="middle">[Component: sportcut-media]</text><text class="body" x="920.0" y="143.0" text-anchor="middle">Probe, proxy, audio, frames</text><text class="body" x="920.0" y="155.5" text-anchor="middle">through the media</text><text class="body" x="920.0" y="168.0" text-anchor="middle">toolchain.</text></g><g class="node component"><rect x="1030.0" y="80.0" width="180.0" height="83.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="1120.0" y="106.0" text-anchor="middle">Vision</text><text class="tech" x="1120.0" y="119.0" text-anchor="middle">[Component: sportcut-vision]</text><text class="body" x="1120.0" y="143.0" text-anchor="middle">Court and player detection;</text><text class="body" x="1120.0" y="155.5" text-anchor="middle">TFLite is optional.</text></g><g class="node component"><rect x="630.0" y="200.0" width="180.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="720.0" y="226.0" text-anchor="middle">Export</text><text class="tech" x="720.0" y="239.0" text-anchor="middle">[Component: sportcut-export]</text><text class="body" x="720.0" y="263.0" text-anchor="middle">Edit list and render.</text></g><g class="node component"><rect x="830.0" y="200.0" width="180.0" height="83.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="920.0" y="226.0" text-anchor="middle">Evaluation</text><text class="tech" x="920.0" y="239.0" text-anchor="middle">[Component: sportcut-eval]</text><text class="body" x="920.0" y="263.0" text-anchor="middle">Segmentation and ranking</text><text class="body" x="920.0" y="275.5" text-anchor="middle">evaluation.</text></g><g class="node component"><rect x="630.0" y="470.0" width="180.0" height="83.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="720.0" y="496.0" text-anchor="middle">Common</text><text class="tech" x="720.0" y="509.0" text-anchor="middle">[Component: sportcut-common]</text><text class="body" x="720.0" y="533.0" text-anchor="middle">Shared types. Every crate</text><text class="body" x="720.0" y="545.5" text-anchor="middle">may use it.</text></g><g class="node component"><rect x="830.0" y="470.0" width="180.0" height="83.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="920.0" y="496.0" text-anchor="middle">Court</text><text class="tech" x="920.0" y="509.0" text-anchor="middle">[Component: sportcut-court]</text><text class="body" x="920.0" y="533.0" text-anchor="middle">Homography, validation, net</text><text class="body" x="920.0" y="545.5" text-anchor="middle">projection.</text></g><g class="node component"><rect x="1030.0" y="470.0" width="180.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="1120.0" y="496.0" text-anchor="middle">Rally</text><text class="tech" x="1120.0" y="509.0" text-anchor="middle">[Component: sportcut-rally]</text><text class="body" x="1120.0" y="533.0" text-anchor="middle">Rally segmentation.</text></g><g class="node component"><rect x="630.0" y="590.0" width="180.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="720.0" y="616.0" text-anchor="middle">Score</text><text class="tech" x="720.0" y="629.0" text-anchor="middle">[Component: sportcut-score]</text><text class="body" x="720.0" y="653.0" text-anchor="middle">Score and serving rules.</text></g><g class="node component"><rect x="830.0" y="590.0" width="180.0" height="70.5" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="920.0" y="616.0" text-anchor="middle">Highlight</text><text class="tech" x="920.0" y="629.0" text-anchor="middle">[Component: sportcut-highlight]</text><text class="body" x="920.0" y="653.0" text-anchor="middle">Highlight ranking.</text></g><g class="node external"><rect x="60.0" y="500.0" width="220.0" height="95.0" rx="7" fill="#f4f2ee" stroke="#b9b4a9" stroke-width="1.2"/><text class="name" x="170.0" y="526.0" text-anchor="middle">ffmpeg / ffprobe</text><text class="tech" x="170.0" y="539.0" text-anchor="middle">[External system: Media toolchain ·</text><text class="tech" x="170.0" y="551.0" text-anchor="middle">required]</text><text class="body" x="170.0" y="575.0" text-anchor="middle">Probe, proxy, audio, frames, and</text><text class="body" x="170.0" y="587.5" text-anchor="middle">export. Required at runtime.</text></g><g class="node external"><rect x="310.0" y="500.0" width="220.0" height="95.0" rx="7" fill="#f4f2ee" stroke="#b9b4a9" stroke-width="1.2"/><text class="name" x="420.0" y="526.0" text-anchor="middle">TFLite runtime + model</text><text class="tech" x="420.0" y="539.0" text-anchor="middle">[External system: EfficientDet-Lite0 ·</text><text class="tech" x="420.0" y="551.0" text-anchor="middle">optional]</text><text class="body" x="420.0" y="575.0" text-anchor="middle">Player tracking only. Absent when</text><text class="body" x="420.0" y="587.5" text-anchor="middle">the build omits macos-tflite-eval.</text></g><g class="node component"><rect x="60.0" y="690.0" width="220.0" height="95.0" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text class="name" x="170.0" y="716.0" text-anchor="middle">CLI driver</text><text class="tech" x="170.0" y="729.0" text-anchor="middle">[Component: sportcut-cli ·</text><text class="tech" x="170.0" y="741.0" text-anchor="middle">core/drivers/cli]</text><text class="body" x="170.0" y="765.0" text-anchor="middle">Developer entry point. Not shipped</text><text class="body" x="170.0" y="777.5" text-anchor="middle">in the app.</text></g></g><line x1="24" y1="828" x2="1216" y2="828" stroke="#e5e2da"/><line x1="24" y1="843" x2="50" y2="843" stroke="#3d444d" stroke-width="1.3"/><text class="legend" x="56" y="846">Declared relationship</text><line x1="189.1" y1="843" x2="215.1" y2="843" stroke="#8b939c" stroke-width="1.3"/><text class="legend" x="221.1" y="846">Compile-time dependency (cargo metadata)</text></svg>
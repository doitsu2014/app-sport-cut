<svg xmlns="http://www.w3.org/2000/svg" width="980" height="516" viewBox="0 0 980 516" role="img" aria-labelledby="title desc">
<title id="title">Sportcut — System context</title>
<desc id="desc">Who uses Sportcut, and what it touches outside its own boundary.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .heading { font-size: 14px; font-weight: 600; fill: #1f2328; }
  .group-label { font-size: 9.5px; font-weight: 600; letter-spacing: 0.09em; fill: #6b7280; }
  .name { font-size: 12.5px; font-weight: 600; fill: #1f2328; }
  .tech { font-size: 9px; fill: #6b7280; }
  .body { font-size: 10px; fill: #3d444d; }
  .note-body { font-size: 10px; fill: #6b7280; font-style: italic; }
  .edge-label { font-size: 9.5px; fill: #3d444d; }
  .legend { font-size: 9.5px; fill: #6b7280; }
</style>
<defs>
  <marker id="arrow-declared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d444d"/></marker>
  <marker id="arrow-derived" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b939c"/></marker>
  <marker id="arrow-interim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8630a"/></marker>
</defs>
<rect x="0" y="0" width="980" height="516" fill="#ffffff"/>
<text class="heading" x="24" y="26">L1 · System context</text><g class="edges"><path d="M 250.0 222.9 Q 310.0 220.1 370.0 217.3" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#arrow-declared)"/><rect x="251.1" y="262.5" width="122.7" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="312.4" y="273.5" text-anchor="middle">imports, marks, exports</text><path d="M 620.0 218.6 Q 680.0 222.1 740.0 225.5" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#arrow-declared)"/><rect x="647.1" y="228.5" width="63.9" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="679.1" y="239.5" text-anchor="middle">plays video</text><path d="M 620.0 174.4 Q 680.0 156.7 740.0 138.9" fill="none" stroke="#3d444d" stroke-width="1.3" marker-end="url(#arrow-declared)"/><rect x="633.0" y="162.5" width="103.1" height="19.0" rx="3" fill="#ffffff" fill-opacity="0.94"/><text class="edge-label" x="684.5" y="173.5" text-anchor="middle">copies into custody</text></g><g class="nodes"><g class="node person"><rect x="40.0" y="180.0" width="210.0" height="95.5" rx="7" fill="#dbe7f0" stroke="#7f9fbf" stroke-width="1.2"/><text class="name" x="145.0" y="206.0" text-anchor="middle">Editor</text><text class="tech" x="145.0" y="219.0" text-anchor="middle">[Person: Human]</text><text class="body" x="145.0" y="243.0" text-anchor="middle">Imports a recording, marks the</text><text class="body" x="145.0" y="255.5" text-anchor="middle">court, confirms rallies and the</text><text class="body" x="145.0" y="268.0" text-anchor="middle">score, exports a highlight.</text></g><g class="node system"><rect x="370.0" y="170.0" width="250.0" height="83.0" rx="7" fill="#e3ece6" stroke="#6f9a82" stroke-width="1.2"/><text class="name" x="495.0" y="196.0" text-anchor="middle">Sportcut</text><text class="tech" x="495.0" y="209.0" text-anchor="middle">[Software system: macOS desktop]</text><text class="body" x="495.0" y="233.0" text-anchor="middle">Turns one badminton recording into a</text><text class="body" x="495.0" y="245.5" text-anchor="middle">highlight video on this Mac.</text></g><g class="node external"><rect x="740.0" y="60.0" width="210.0" height="95.5" rx="7" fill="#f4f2ee" stroke="#b9b4a9" stroke-width="1.2"/><text class="name" x="845.0" y="86.0" text-anchor="middle">Recording files</text><text class="tech" x="845.0" y="99.0" text-anchor="middle">[External system: User-owned files]</text><text class="body" x="845.0" y="123.0" text-anchor="middle">The recording the user picked.</text><text class="body" x="845.0" y="135.5" text-anchor="middle">Sportcut copies it into custody</text><text class="body" x="845.0" y="148.0" text-anchor="middle">and never modifies the original.</text></g><g class="node external"><rect x="740.0" y="190.0" width="210.0" height="83.0" rx="7" fill="#f4f2ee" stroke="#b9b4a9" stroke-width="1.2"/><text class="name" x="845.0" y="216.0" text-anchor="middle">AVFoundation</text><text class="tech" x="845.0" y="229.0" text-anchor="middle">[External system: macOS framework]</text><text class="body" x="845.0" y="253.0" text-anchor="middle">Plays the recording and its proxy</text><text class="body" x="845.0" y="265.5" text-anchor="middle">in the client.</text></g><g class="node note"><rect x="740.0" y="320.0" width="210.0" height="96.0" rx="7" fill="#ffffff" stroke="#b9b4a9" stroke-width="1.2" stroke-dasharray="5 4"/><text class="name" x="845.0" y="344.0" text-anchor="middle">No network</text><text class="note-body" x="845.0" y="360.0" text-anchor="middle">There is no cloud service,</text><text class="note-body" x="845.0" y="372.5" text-anchor="middle">telemetry endpoint, or online API</text><text class="note-body" x="845.0" y="385.0" text-anchor="middle">on any path. Recordings and</text><text class="note-body" x="845.0" y="397.5" text-anchor="middle">analysis stay on this Mac.</text></g></g><line x1="24" y1="478" x2="956" y2="478" stroke="#e5e2da"/><line x1="24" y1="493" x2="50" y2="493" stroke="#3d444d" stroke-width="1.3"/><text class="legend" x="56" y="496">Declared relationship</text></svg>